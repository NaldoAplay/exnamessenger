<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>ExnaCode</title>

<link rel="manifest"
href="manifest.json">

<link rel="apple-touch-icon"
href="icon-192.png">

<meta name="theme-color"
content="#0d1117">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#0d1117;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

/* APP */

.app{
display:flex;
flex-direction:column;
width:100%;
height:100%;
}

/* TOPBAR */

.topbar{
height:60px;
background:#161b22;
border-bottom:1px solid #30363d;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
flex-shrink:0;
}

.logo{
display:flex;
align-items:center;
gap:12px;
font-size:22px;
font-weight:700;
color:#58a6ff;
}

.logo img{
width:38px;
height:38px;
border-radius:10px;
}

/* ACTIONS */

.actions{
display:flex;
gap:10px;
overflow:auto;
}

.actions button{
background:#238636;
border:none;
color:white;
padding:10px 14px;
border-radius:10px;
font-size:14px;
font-weight:600;
cursor:pointer;
white-space:nowrap;
}

/* MAIN */

.main{
flex:1;
display:flex;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
width:260px;
background:#11161d;
border-right:1px solid #30363d;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* PROJECT HEADER */

.project-header{
padding:14px;
border-bottom:1px solid #30363d;
display:flex;
justify-content:space-between;
align-items:center;
}

.project-header span{
font-size:14px;
font-weight:700;
color:#58a6ff;
}

.project-actions{
display:flex;
gap:8px;
}

.project-actions button{
background:#1f6feb;
border:none;
color:white;
padding:6px 10px;
border-radius:8px;
font-size:12px;
}

/* FILE LIST */

.files{
flex:1;
overflow:auto;
padding:10px;
}

.file{
padding:12px;
border-radius:10px;
margin-bottom:6px;
background:#161b22;
font-size:14px;
cursor:pointer;
color:#c9d1d9;
display:flex;
align-items:center;
gap:10px;
}

.file.active{
background:#1f6feb;
}

/* EDITOR AREA */

.workspace{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* TABS */

.tabs{
height:42px;
background:#11161d;
display:flex;
align-items:center;
border-bottom:1px solid #30363d;
overflow:auto;
}

.tab{
height:100%;
padding:0 18px;
display:flex;
align-items:center;
font-size:14px;
color:#8b949e;
border-right:1px solid #30363d;
white-space:nowrap;
}

.tab.active{
background:#0d1117;
color:#58a6ff;
}

/* EDITOR */

#editor{
flex:1;
}

/* STATUS */

.status{
height:34px;
background:#161b22;
border-top:1px solid #30363d;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
font-size:13px;
color:#8b949e;
}

/* MOBILE */

@media(max-width:900px){

.sidebar{
width:210px;
}

.actions{
gap:6px;
}

.actions button{
padding:8px 11px;
font-size:12px;
}

.logo{
font-size:18px;
}

}

/* SCROLL */

::-webkit-scrollbar{
width:6px;
height:6px;
}

::-webkit-scrollbar-thumb{
background:#30363d;
border-radius:20px;
}

</style>

</head>

<body>

<div class="app">

<!-- TOPBAR -->

<div class="topbar">

<div class="logo">

<img src="icon-192.png">

<span>
EXNACODE
</span>

</div>

<div class="actions">

<button onclick="openPreview()">
Preview
</button>

<button onclick="saveProject()">
Salvar
</button>

<button onclick="copyCode()">
Copiar
</button>

<button onclick="formatCode()">
Formatar
</button>

<button onclick="toggleFullscreen()">
Tela Cheia
</button>

</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="project-header">

<span>
EXNA PROJECT
</span>

<div class="project-actions">

<button onclick="newFile()">
+Arquivo
</button>

<button onclick="newFolder()">
+Pasta
</button>

</div>

</div>

<div class="files"
id="files">

</div>

</div>

<!-- WORKSPACE -->

<div class="workspace">

<div class="tabs"
id="tabs">

</div>

<div id="editor"></div>

<div class="status">

<span id="statusText">
ExnaCode pronto ✔
</span>

<span>
iPad Mode
</span>

</div>

</div>

</div>

</div>

<!-- MONACO -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

<script>

/* FILE SYSTEM */

let project = {

"index.html":
`<div class="container">

<h1>Olá ExnaCode 🚀</h1>

<button onclick="showMessage()">
Clique Aqui
</button>

</div>`,

"style.css":
`body{
margin:0;
background:#000;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
text-align:center;
}

button{
padding:15px 25px;
border:none;
border-radius:12px;
background:#58a6ff;
color:white;
font-size:18px;
}`,

"script.js":
`function showMessage(){

alert("Funcionando!");

}`

};

/* LOAD */

const saved =
localStorage.getItem("exnacode-project");

if(saved){

project =
JSON.parse(saved);

}

let currentFile =
"index.html";

/* MONACO */

require.config({

paths:{
vs:
"https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs"
}

});

require(["vs/editor/editor.main"],()=>{

window.editor =
monaco.editor.create(
document.getElementById("editor"),
{

value:project[currentFile],

language:"html",

theme:"vs-dark",

automaticLayout:true,

fontSize:16,

minimap:{
enabled:true
},

wordWrap:"on",

smoothScrolling:true,

autoClosingBrackets:"always",

autoClosingQuotes:"always",

tabSize:2

}
);

editor.onDidChangeModelContent(()=>{

project[currentFile] =
editor.getValue();

saveLocal();

});

renderFiles();

});

/* SAVE */

function saveLocal(){

localStorage.setItem(
"exnacode-project",
JSON.stringify(project)
);

}

/* RENDER FILES */

function renderFiles(){

const files =
document.getElementById("files");

const tabs =
document.getElementById("tabs");

files.innerHTML = "";
tabs.innerHTML = "";

Object.keys(project).forEach(name=>{

/* SIDEBAR */

const file =
document.createElement("div");

file.className =
"file" +
(name===currentFile
?" active":"");

file.innerHTML =
"📄 " + name;

file.onclick =
()=>openFile(name);

files.appendChild(file);

/* TAB */

const tab =
document.createElement("div");

tab.className =
"tab" +
(name===currentFile
?" active":"");

tab.innerText = name;

tabs.appendChild(tab);

});

}

/* OPEN FILE */

function openFile(name){

project[currentFile] =
editor.getValue();

currentFile = name;

editor.setValue(
project[name]
);

if(name.endsWith(".html")){

monaco.editor.setModelLanguage(
editor.getModel(),
"html"
);

}

if(name.endsWith(".css")){

monaco.editor.setModelLanguage(
editor.getModel(),
"css"
);

}

if(name.endsWith(".js")){

monaco.editor.setModelLanguage(
editor.getModel(),
"javascript"
);

}

renderFiles();

}

/* NEW FILE */

function newFile(){

const name =
prompt("Nome do arquivo:");

if(!name) return;

project[name] = "";

saveLocal();

renderFiles();

}

/* NEW FOLDER */

function newFolder(){

alert(
"Pastas serão adicionadas na próxima versão 😄"
);

}

/* PREVIEW */

function openPreview(){

saveLocal();

window.open(
"preview.html",
"_blank"
);

}

/* COPY */

function copyCode(){

navigator.clipboard.writeText(
editor.getValue()
);

alert("Código copiado!");

}

/* FORMAT */

async function formatCode(){

await editor
.getAction(
"editor.action.formatDocument"
)
.run();

}

/* EXPORT */

function saveProject(){

saveLocal();

const blob =
new Blob(
[
JSON.stringify(
project,
null,
2
)
],
{
type:"application/json"
}
);

const a =
document.createElement("a");

a.href =
URL.createObjectURL(blob);

a.download =
"ExnaProject.json";

a.click();

}

/* FULLSCREEN */

function toggleFullscreen(){

if(!document.fullscreenElement){

document.documentElement
.requestFullscreen();

}else{

document.exitFullscreen();

}

}

/* SHORTCUTS */

document.addEventListener(
"keydown",
(e)=>{

if(e.metaKey && e.key==="s"){

e.preventDefault();

saveProject();

}

if(e.metaKey && e.key==="p"){

e.preventDefault();

openPreview();

}

}
);

/* PWA */

if("serviceWorker" in navigator){

navigator.serviceWorker
.register(
"service-worker.js"
);

}

</script>

</body>
</html>
