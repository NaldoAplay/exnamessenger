<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>ExnaCode</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#0d1117;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

/* APP */

.app{
display:flex;
flex-direction:column;
width:100%;
height:100%;
}

/* TOPBAR */

.topbar{
height:60px;
background:#161b22;
border-bottom:1px solid #30363d;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
flex-shrink:0;
}

.logo{
font-size:22px;
font-weight:700;
color:#58a6ff;
letter-spacing:1px;
}

.actions{
display:flex;
gap:10px;
overflow:auto;
}

.actions button{
background:#238636;
border:none;
color:white;
padding:10px 14px;
border-radius:10px;
font-size:14px;
font-weight:600;
cursor:pointer;
white-space:nowrap;
}

.actions button:active{
transform:scale(.95);
}

/* EDITOR */

#editor{
flex:1;
width:100%;
}

/* STATUS */

.status{
height:34px;
background:#161b22;
border-top:1px solid #30363d;
display:flex;
align-items:center;
padding:0 15px;
font-size:13px;
color:#8b949e;
flex-shrink:0;
}

/* MOBILE */

@media(max-width:700px){

.actions{
gap:6px;
}

.actions button{
padding:9px 12px;
font-size:13px;
}

.logo{
font-size:18px;
}

}

</style>

</head>

<body>

<div class="app">

<!-- TOPBAR -->

<div class="topbar">

<div class="logo">
EXNACODE
</div>

<div class="actions">

<button onclick="openPreview()">
Preview
</button>

<button onclick="saveFile()">
Salvar
</button>

<button onclick="copyCode()">
Copiar
</button>

<button onclick="formatCode()">
Formatar
</button>

<button onclick="toggleFullscreen()">
Tela Cheia
</button>

</div>

</div>

<!-- EDITOR -->

<div id="editor"></div>

<!-- STATUS -->

<div class="status">
ExnaCode Monaco Editor ✔
</div>

</div>

<!-- MONACO -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

<script>

require.config({
paths:{
vs:
"https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs"
}
});

require(["vs/editor/editor.main"],()=>{

window.editor =
monaco.editor.create(
document.getElementById("editor"),
{

value:

`<!DOCTYPE html>

<html>

<head>

<style>

body{
background:#000;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
flex-direction:column;
gap:20px;
}

button{
padding:15px 25px;
border:none;
border-radius:12px;
background:#58a6ff;
color:white;
font-size:18px;
}

</style>

</head>

<body>

<h1>Olá ExnaCode 🚀</h1>

<button onclick="alert('Funcionando!')">
Clique Aqui
</button>

</body>

</html>`,

language:"html",

theme:"vs-dark",

automaticLayout:true,

fontSize:16,

minimap:{
enabled:true
},

wordWrap:"on",

roundedSelection:true,

scrollBeyondLastLine:false,

cursorSmoothCaretAnimation:"on",

smoothScrolling:true,

formatOnPaste:true,

formatOnType:true,

autoClosingBrackets:"always",

autoClosingQuotes:"always",

tabSize:2

}
);

/* LOAD */

const saved =
localStorage.getItem("exnacode");

if(saved){

editor.setValue(saved);

}

/* AUTO SAVE */

editor.onDidChangeModelContent(()=>{

localStorage.setItem(
"exnacode",
editor.getValue()
);

});

});

/* PREVIEW */

function openPreview(){

window.open(
"preview.html",
"_blank"
);

}

/* SAVE */

function saveFile(){

const code =
editor.getValue();

const blob =
new Blob([code],{
type:"text/html"
});

const a =
document.createElement("a");

a.href =
URL.createObjectURL(blob);

a.download =
"index.html";

a.click();

}

/* COPY */

function copyCode(){

navigator.clipboard.writeText(
editor.getValue()
);

alert("Código copiado!");

}

/* FORMAT */

async function formatCode(){

await editor
.getAction(
"editor.action.formatDocument"
)
.run();

}

/* FULLSCREEN */

function toggleFullscreen(){

if(!document.fullscreenElement){

document.documentElement
.requestFullscreen();

}else{

document.exitFullscreen();

}

}

/* SHORTCUTS */

document.addEventListener(
"keydown",
(e)=>{

if(e.metaKey && e.key==="s"){

e.preventDefault();

saveFile();

}

if(e.metaKey && e.key==="p"){

e.preventDefault();

openPreview();

}

}
);
  /* PWA */

if("serviceWorker" in navigator){

navigator.serviceWorker
.register("service-worker.js");

}

</script>

</body>
</html>
