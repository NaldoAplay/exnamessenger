<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>ExnaCode</title>

<link rel="apple-touch-icon"
href="icon-192.png">

<link rel="manifest"
href="manifest.json">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#0d1117;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

/* APP */

.app{
display:flex;
flex-direction:column;
width:100%;
height:100%;
}

/* TOPBAR */

.topbar{
height:60px;
background:#161b22;
border-bottom:1px solid #30363d;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
flex-shrink:0;
}

.logo{
display:flex;
align-items:center;
gap:12px;
font-size:22px;
font-weight:700;
color:#58a6ff;
letter-spacing:1px;
}

.logo-icon{
width:38px;
height:38px;
border-radius:10px;
object-fit:cover;
}

.actions{
display:flex;
gap:10px;
overflow:auto;
}

.actions button{
background:#238636;
border:none;
color:white;
padding:10px 14px;
border-radius:10px;
font-size:14px;
font-weight:600;
cursor:pointer;
white-space:nowrap;
transition:.2s;
}

.actions button:active{
transform:scale(.95);
}

/* TABS */

.tabs{
height:42px;
background:#11161d;
display:flex;
align-items:center;
border-bottom:1px solid #30363d;
overflow:auto;
flex-shrink:0;
}

.tab{
height:100%;
padding:0 18px;
display:flex;
align-items:center;
font-size:14px;
color:#8b949e;
border-right:1px solid #30363d;
cursor:pointer;
white-space:nowrap;
}

.tab.active{
background:#0d1117;
color:#58a6ff;
}

/* EDITOR */

#editor{
flex:1;
width:100%;
}

/* STATUS */

.status{
height:34px;
background:#161b22;
border-top:1px solid #30363d;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
font-size:13px;
color:#8b949e;
flex-shrink:0;
}

/* MOBILE */

@media(max-width:700px){

.actions{
gap:6px;
}

.actions button{
padding:9px 12px;
font-size:13px;
}

.logo{
font-size:18px;
}

}

/* SCROLL */

::-webkit-scrollbar{
width:6px;
height:6px;
}

::-webkit-scrollbar-thumb{
background:#30363d;
border-radius:20px;
}

</style>

</head>

<body>

<div class="app">

<!-- TOPBAR -->

<div class="topbar">

<div class="logo">

<img
src="icon-192.png"
class="logo-icon">

<span>
EXNACODE
</span>

</div>

<div class="actions">

<button onclick="openPreview()">
Preview
</button>

<button onclick="saveProject()">
Salvar
</button>

<button onclick="copyCode()">
Copiar
</button>

<button onclick="formatCode()">
Formatar
</button>

<button onclick="toggleFullscreen()">
Tela Cheia
</button>

</div>

</div>

<!-- TABS -->

<div class="tabs">

<div class="tab active"
onclick="switchFile('html',this)">
index.html
</div>

<div class="tab"
onclick="switchFile('css',this)">
style.css
</div>

<div class="tab"
onclick="switchFile('js',this)">
script.js
</div>

</div>

<!-- EDITOR -->

<div id="editor"></div>

<!-- STATUS -->

<div class="status">

<span id="statusText">
ExnaCode pronto ✔
</span>

<span>
iPad Mode
</span>

</div>

</div>

<!-- MONACO -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

<script>

let currentFile = "html";

/* FILES */

let files = {

html:

`<div class="container">

<h1>Olá ExnaCode 🚀</h1>

<button onclick="showMessage()">
Clique Aqui
</button>

</div>`,

css:

`body{
margin:0;
background:#000;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
text-align:center;
}

button{
padding:15px 25px;
border:none;
border-radius:12px;
background:#58a6ff;
color:white;
font-size:18px;
}`,

js:

`function showMessage(){

alert("Funcionando!");

}`

};

/* LOAD */

const saved =
localStorage.getItem("exnacode-project");

if(saved){

files = JSON.parse(saved);

}

/* MONACO */

require.config({

paths:{
vs:
"https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs"
}

});

require(["vs/editor/editor.main"],()=>{

window.editor =
monaco.editor.create(
document.getElementById("editor"),
{

value:files.html,

language:"html",

theme:"vs-dark",

automaticLayout:true,

fontSize:16,

minimap:{
enabled:true
},

wordWrap:"on",

roundedSelection:true,

scrollBeyondLastLine:false,

cursorSmoothCaretAnimation:"on",

smoothScrolling:true,

formatOnPaste:true,

formatOnType:true,

autoClosingBrackets:"always",

autoClosingQuotes:"always",

tabSize:2

}
);

/* AUTO SAVE */

editor.onDidChangeModelContent(()=>{

files[currentFile] =
editor.getValue();

saveLocal();

});

});

/* SWITCH FILE */

function switchFile(file,el){

files[currentFile] =
editor.getValue();

currentFile = file;

document.querySelectorAll(".tab")
.forEach(tab=>{

tab.classList.remove("active");

});

el.classList.add("active");

editor.setValue(files[file]);

if(file==="html"){

monaco.editor.setModelLanguage(
editor.getModel(),
"html"
);

}

if(file==="css"){

monaco.editor.setModelLanguage(
editor.getModel(),
"css"
);

}

if(file==="js"){

monaco.editor.setModelLanguage(
editor.getModel(),
"javascript"
);

}

}

/* SAVE LOCAL */

function saveLocal(){

localStorage.setItem(
"exnacode-project",
JSON.stringify(files)
);

}

/* PREVIEW */

function openPreview(){

saveLocal();

window.open(
"preview.html",
"_blank"
);

}

/* COPY */

function copyCode(){

navigator.clipboard.writeText(
editor.getValue()
);

alert("Código copiado!");

}

/* FORMAT */

async function formatCode(){

await editor
.getAction(
"editor.action.formatDocument"
)
.run();

}

/* SAVE PROJECT */

function saveProject(){

saveLocal();

const project = {

"index.html":files.html,

"style.css":files.css,

"script.js":files.js

};

const blob =
new Blob(
[
JSON.stringify(project,null,2)
],
{
type:"application/json"
}
);

const a =
document.createElement("a");

a.href =
URL.createObjectURL(blob);

a.download =
"ExnaCodeProject.json";

a.click();

}

/* FULLSCREEN */

function toggleFullscreen(){

if(!document.fullscreenElement){

document.documentElement
.requestFullscreen();

}else{

document.exitFullscreen();

}

}

/* SHORTCUTS */

document.addEventListener(
"keydown",
(e)=>{

if(e.metaKey && e.key==="s"){

e.preventDefault();

saveProject();

}

if(e.metaKey && e.key==="p"){

e.preventDefault();

openPreview();

}

}
);

/* PWA */

if("serviceWorker" in navigator){

navigator.serviceWorker
.register("service-worker.js");

}

</script>

</body>
</html>
