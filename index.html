<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>ExnaCode</title>

<link rel="manifest"
href="manifest.json">

<link rel="apple-touch-icon"
href="icon-192.png">

<meta name="theme-color"
content="#0d1117">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#0d1117;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

/* APP */

.app{
display:flex;
flex-direction:column;
width:100%;
height:100%;
}

/* TOPBAR */

.topbar{
height:60px;
background:#161b22;
border-bottom:1px solid #30363d;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
flex-shrink:0;
gap:15px;
}

.logo{
display:flex;
align-items:center;
gap:12px;
font-size:22px;
font-weight:700;
color:#58a6ff;
white-space:nowrap;
}

.logo img{
width:38px;
height:38px;
border-radius:10px;
}

/* ACTIONS */

.actions{
display:flex;
gap:10px;
overflow:auto;
}

.actions button{
background:#238636;
border:none;
color:white;
padding:10px 14px;
border-radius:10px;
font-size:14px;
font-weight:600;
cursor:pointer;
white-space:nowrap;
transition:.2s;
}

.actions button:active{
transform:scale(.95);
}

/* MAIN */

.main{
flex:1;
display:flex;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
width:270px;
background:#11161d;
border-right:1px solid #30363d;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* PROJECT HEADER */

.project-header{
padding:14px;
border-bottom:1px solid #30363d;
display:flex;
justify-content:space-between;
align-items:center;
}

.project-header span{
font-size:14px;
font-weight:700;
color:#58a6ff;
}

.project-actions{
display:flex;
gap:8px;
}

.project-actions button{
background:#1f6feb;
border:none;
color:white;
padding:6px 10px;
border-radius:8px;
font-size:12px;
cursor:pointer;
}

/* FILES */

.files{
flex:1;
overflow:auto;
padding:10px;
}

.file,
.folder{
padding:11px;
border-radius:10px;
margin-bottom:5px;
font-size:14px;
cursor:pointer;
display:flex;
align-items:center;
gap:10px;
color:#c9d1d9;
}

.file:hover,
.folder:hover{
background:#1b2430;
}

.file.active{
background:#1f6feb;
}

.folder{
font-weight:700;
color:#58a6ff;
}

/* WORKSPACE */

.workspace{
flex:1;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* TABS */

.tabs{
height:42px;
background:#11161d;
display:flex;
align-items:center;
overflow:auto;
border-bottom:1px solid #30363d;
}

.tab{
height:100%;
padding:0 18px;
display:flex;
align-items:center;
font-size:14px;
color:#8b949e;
border-right:1px solid #30363d;
cursor:pointer;
white-space:nowrap;
}

.tab.active{
background:#0d1117;
color:#58a6ff;
}

/* EDITOR */

#editor{
flex:1;
}

/* STATUS */

.status{
height:34px;
background:#161b22;
border-top:1px solid #30363d;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
font-size:13px;
color:#8b949e;
}

/* MOBILE */

@media(max-width:900px){

.sidebar{
width:220px;
}

.logo{
font-size:18px;
}

.actions button{
padding:8px 11px;
font-size:12px;
}

}

/* SCROLL */

::-webkit-scrollbar{
width:6px;
height:6px;
}

::-webkit-scrollbar-thumb{
background:#30363d;
border-radius:20px;
}
  #menuBtn{
background:#1f6feb;
border:none;
color:white;
width:42px;
height:42px;
border-radius:10px;
font-size:20px;
cursor:pointer;
flex-shrink:0;
}

/* SIDEBAR */

.sidebar{
width:270px;
transition:.25s;
}

/* CLOSED */

.sidebar.closed{
width:0;
border:none;
overflow:hidden;
}

</style>

</head>

<body>

<div class="app">

<!-- TOPBAR -->

<div class="topbar">
  <button id="menuBtn"
onclick="toggleSidebar()">

☰

</button>

<div class="logo">

<img src="icon-192.png">

<span>
EXNACODE
</span>

</div>

<div class="actions">

<button onclick="createFile()">
Arquivo
</button>

<button onclick="createFolder()">
Pasta
</button>

<button onclick="openPreview()">
Preview
</button>

<button onclick="refreshPreview()">
Atualizar
</button>

<button onclick="saveProject()">
Salvar
</button>

<button onclick="clearCache()">
Limpar
</button>

<button onclick="toggleFullscreen()">
Tela Cheia
</button>

</div>

</div>

<!-- MAIN -->

<div class="main">

<!-- SIDEBAR -->

<div class="sidebar">

<div class="project-header">

<span>
EXNA PROJECT
</span>

<div class="project-actions">

<button onclick="openDeviceFiles()">
Abrir
</button>

</div>

</div>

<div class="files"
id="files">

</div>

</div>

<!-- WORKSPACE -->

<div class="workspace">

<div class="tabs"
id="tabs">

</div>

<div id="editor"></div>

<div class="status">

<span id="statusText">
ExnaCode v2 ✔
</span>

<span>
iPad Dev Mode
</span>

</div>

</div>

</div>

</div>

<!-- MONACO -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

<script>

/* PROJECT */

let project = {};

let openedTabs = [];

let currentFile = null;

/* LOAD */

const saved =
localStorage.getItem(
"exnacode-v2"
);

if(saved){

project =
JSON.parse(saved);

}

/* MONACO */

require.config({

paths:{
vs:
"https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs"
}

});

require(["vs/editor/editor.main"],()=>{

window.editor =
monaco.editor.create(
document.getElementById("editor"),
{

value:"",

language:"html",

theme:"vs-dark",

automaticLayout:true,

fontSize:16,

minimap:{
enabled:true
},

wordWrap:"on",

smoothScrolling:true,

autoClosingBrackets:"always",

autoClosingQuotes:"always",

tabSize:2

}
);

editor.onDidChangeModelContent(()=>{

if(currentFile){

project[currentFile] =
editor.getValue();

saveLocal();

}

});

renderExplorer();

});

/* SAVE */

function saveLocal(){

localStorage.setItem(
"exnacode-v2",
JSON.stringify(project)
);

}

/* CREATE FILE */

function createFile(){

const name =
prompt(
"Nome do arquivo:"
);

if(!name) return;

project[name] = "";

saveLocal();

renderExplorer();

}

/* CREATE FOLDER */

function createFolder(){

const name =
prompt(
"Nome da pasta:"
);

if(!name) return;

project["📁 "+name] = null;

saveLocal();

renderExplorer();

}

/* RENDER */

function renderExplorer(){

const files =
document.getElementById("files");

files.innerHTML = "";

Object.keys(project).forEach(name=>{

const item =
document.createElement("div");

if(project[name]===null){

item.className =
"folder";

item.innerHTML =
"📁 " +
name.replace("📁 ","");

}else{

item.className =
"file" +
(name===currentFile
?" active":"");

item.innerHTML =
"📄 " + name;

item.onclick =
()=>openFile(name);

}

files.appendChild(item);

});

renderTabs();

}

/* OPEN FILE */

function openFile(name){

currentFile = name;

editor.setValue(
project[name]
);

if(!openedTabs.includes(name)){

openedTabs.push(name);

}

detectLanguage(name);

renderTabs();

}

/* TABS */

function renderTabs(){

const tabs =
document.getElementById("tabs");

tabs.innerHTML = "";

openedTabs.forEach(name=>{

const tab =
document.createElement("div");

tab.className =
"tab" +
(name===currentFile
?" active":"");

tab.innerText = name;

tab.onclick =
()=>openFile(name);

tabs.appendChild(tab);

});

}

/* LANGUAGE */

function detectLanguage(name){

if(name.endsWith(".html")){

monaco.editor.setModelLanguage(
editor.getModel(),
"html"
);

}

if(name.endsWith(".css")){

monaco.editor.setModelLanguage(
editor.getModel(),
"css"
);

}

if(name.endsWith(".js")){

monaco.editor.setModelLanguage(
editor.getModel(),
"javascript"
);

}

}

/* PREVIEW */

function openPreview(){

saveLocal();

window.open(
"preview.html",
"_blank"
);

}

/* REFRESH */

function refreshPreview(){

localStorage.setItem(
"preview-refresh",
Date.now()
);

alert(
"Preview atualizado!"
);

}

/* SAVE PROJECT */

function saveProject(){

saveLocal();

const blob =
new Blob(
[
JSON.stringify(
project,
null,
2
)
],
{
type:"application/json"
}
);

const a =
document.createElement("a");

a.href =
URL.createObjectURL(blob);

a.download =
"ExnaProject.json";

a.click();

}

/* CLEAR */

function clearCache(){

if(
confirm(
"Limpar projeto e cache?"
)
){

localStorage.clear();

location.reload();

}

}

/* FULLSCREEN */

function toggleFullscreen(){

if(!document.fullscreenElement){

document.documentElement
.requestFullscreen();

}else{

document.exitFullscreen();

}

}

/* OPEN DEVICE */

async function openDeviceFiles(){

alert(
"No iPad o Safari ainda limita abrir pastas reais 😅"
);

}

/* PWA */

if("serviceWorker" in navigator){

navigator.serviceWorker
.register(
"service-worker.js"
);

}
  /* SIDEBAR */

function toggleSidebar(){

document
.querySelector(".sidebar")
.classList
.toggle("closed");

}

</script>

</body>
</html>
