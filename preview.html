<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>Exna Preview</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#0d1117;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

/* TOPBAR */

.topbar{
position:fixed;
top:0;
left:0;
right:0;
height:60px;
background:#161b22;
border-bottom:1px solid #30363d;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
z-index:9999;
}

/* BACK */

.back-btn{
background:#1f6feb;
border:none;
color:white;
padding:11px 16px;
border-radius:12px;
font-size:14px;
font-weight:600;
cursor:pointer;
}

/* TITLE */

.title{
color:#58a6ff;
font-size:16px;
font-weight:700;
}

/* REFRESH */

.refresh-btn{
background:#238636;
border:none;
color:white;
padding:11px 16px;
border-radius:12px;
font-size:14px;
font-weight:600;
cursor:pointer;
}

/* IFRAME */

iframe{
position:absolute;
top:60px;
left:0;
width:100%;
height:calc(100% - 60px);
border:none;
background:white;
}

</style>

</head>

<body>

<!-- TOPBAR -->

<div class="topbar">

<button class="back-btn"
onclick="goBack()">

← Voltar

</button>

<div class="title">
EXNA PREVIEW
</div>

<button class="refresh-btn"
onclick="buildPreview()">

Atualizar

</button>

</div>

<!-- PREVIEW -->

<iframe id="preview"></iframe>

<script>

const frame =
document.getElementById("preview");

let lastCode = "";

/* BUILD */

function buildPreview(){

const project =
JSON.parse(
localStorage.getItem(
"exnacode-v2"
)
);

if(!project) return;

/* FILES */

let html = "";
let css = "";
let js = "";

/* GET FILES */

Object.keys(project).forEach(name=>{

const content =
project[name];

if(content===null) return;

/* HTML */

if(name.endsWith(".html")){

html += "\n" + content;

}

/* CSS */

if(name.endsWith(".css")){

css += "\n" + content;

}

/* JS */

if(name.endsWith(".js")){

js += "\n" + content;

}

});

/* FINAL */

const finalCode =

`
<!DOCTYPE html>

<html>

<head>

<style>

${css}

</style>

</head>

<body>

${html}

<script>

${js}

<\/script>

</body>

</html>
`;

/* UPDATE */

if(finalCode !== lastCode){

frame.srcdoc = finalCode;

lastCode = finalCode;

}

}

/* BACK */

function goBack(){

history.back();

}

/* START */

buildPreview();

/* STORAGE UPDATE */

window.addEventListener(
"storage",
(e)=>{

if(
e.key==="preview-refresh"
||
e.key==="exnacode-v2"
){

buildPreview();

}

}
);

/* AUTO */

setInterval(
buildPreview,
1200
);

</script>

</body>
</html>
