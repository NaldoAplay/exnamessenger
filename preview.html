<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>Exna Preview</title>

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:white;
}

iframe{
width:100%;
height:100%;
border:none;
background:white;
}

</style>

</head>

<body>

<iframe id="preview"></iframe>

<script>

const frame =
document.getElementById("preview");

let lastCode = "";

/* BUILD */

function buildPreview(){

const project =
JSON.parse(
localStorage.getItem(
"exnacode-v2"
)
);

if(!project) return;

/* FILES */

let html = "";
let css = "";
let js = "";

/* GET FILES */

Object.keys(project).forEach(name=>{

const content =
project[name];

if(content===null) return;

/* HTML */

if(name.endsWith(".html")){

html += "\n" + content;

}

/* CSS */

if(name.endsWith(".css")){

css += "\n" + content;

}

/* JS */

if(name.endsWith(".js")){

js += "\n" + content;

}

});

/* FINAL */

const finalCode =

`
<!DOCTYPE html>

<html>

<head>

<style>

${css}

</style>

</head>

<body>

${html}

<script>

${js}

<\/script>

</body>

</html>
`;

/* UPDATE */

if(finalCode !== lastCode){

frame.srcdoc = finalCode;

lastCode = finalCode;

}

}

/* START */

buildPreview();

/* STORAGE UPDATE */

window.addEventListener(
"storage",
(e)=>{

if(
e.key==="preview-refresh"
||
e.key==="exnacode-v2"
){

buildPreview();

}

}
);

/* FALLBACK */

setInterval(
buildPreview,
1200
);

</script>

</body>
</html>
