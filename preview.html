<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>Preview</title>

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:white;
}

iframe{
width:100%;
height:100%;
border:none;
}

</style>

</head>

<body>

<iframe id="preview"></iframe>

<script>

const frame =
document.getElementById("preview");

function updatePreview(){

const files =
JSON.parse(
localStorage.getItem(
"exnacode-project"
)
);

if(!files) return;

const finalCode =

`
<!DOCTYPE html>

<html>

<head>

<style>

${files.css}

</style>

</head>

<body>

${files.html}

<script>

${files.js}

<\/script>

</body>

</html>
`;

frame.srcdoc = finalCode;

}

/* START */

updatePreview();

/* LIVE */

window.addEventListener(
"storage",
updatePreview
);

setInterval(
updatePreview,
500
);

</script>

</body>
</html>
