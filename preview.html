<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>Preview</title>

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:white;
}

iframe{
width:100%;
height:100%;
border:none;
background:white;
}

</style>

</head>

<body>

<iframe id="preview"></iframe>

<script>

const frame =
document.getElementById("preview");

let lastCode = "";

/* BUILD */

function buildPreview(){

const files =
JSON.parse(
localStorage.getItem(
"exnacode-project"
)
);

if(!files) return;

const finalCode =

`
<!DOCTYPE html>

<html>

<head>

<style>

${files["style.css"] || ""}

</style>

</head>

<body>

${files["index.html"] || ""}

<script>

${files["script.js"] || ""}

<\/script>

</body>

</html>
`;

if(finalCode !== lastCode){

frame.srcdoc = finalCode;

lastCode = finalCode;

}

}

/* START */

buildPreview();

/* UPDATE */

window.addEventListener(
"storage",
buildPreview
);

/* LIGHT CHECK */

setInterval(
buildPreview,
1000
);

</script>

</body>
</html>
