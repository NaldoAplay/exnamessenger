<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>Preview</title>

<style>

html,body{
margin:0;
width:100%;
height:100%;
background:white;
overflow:hidden;
}

iframe{
width:100%;
height:100%;
border:none;
}

</style>

</head>

<body>

<iframe id="preview"></iframe>

<script>

const preview =
document.getElementById("preview");

function updatePreview(){

const code =
localStorage.getItem("exnacode");

preview.srcdoc = code;

}

/* START */

updatePreview();

/* LIVE UPDATE */

window.addEventListener(
"storage",
()=>{

updatePreview();

}
);

/* AUTO REFRESH */

setInterval(
updatePreview,
500
);

</script>

</body>
</html>
